# Netlify config for ghosted (written with the netlify-deployment power's guide).
# Netlify's base directory is apps/ghosted; pnpm installs the whole workspace,
# so the engine and shell packages are built from source with the app.
[build]
  base = "apps/ghosted"
  command = "pnpm --filter @decay-engine/ghosted build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "12.21.0"
